# Emails staff about their incomplete critical tasks, daily at 8:00 AM IST.
#
# This was silently not running for two independent reasons: GitHub had
# auto-disabled it (scheduled workflows are switched off after 60 days without
# repository activity), and the script could not start anyway because it used
# require() in a .js file while package.json sets "type": "module".
# If reminders stop again, check the auto-disable first.

name: Daily Critical Task Reminders

on:
  schedule:
    # 02:30 UTC = 08:00 IST
    - cron: '30 2 * * *'
  workflow_dispatch: # manual trigger for testing

jobs:
  send-reminders:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install firebase-admin @emailjs/nodejs --no-save

      - name: Send reminders
        env:
          # The same service-account secret the hosting deploy uses, so this
          # doesn't depend on a separate set of Firebase secrets existing.
          # The three-variable form still works as a fallback.
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MAGNAFLOW_07SEP25 }}
          EMAILJS_SERVICE_ID: ${{ secrets.EMAILJS_SERVICE_ID }}
          EMAILJS_TEMPLATE_ID: ${{ secrets.EMAILJS_TEMPLATE_ID }}
          EMAILJS_PUBLIC_KEY: ${{ secrets.EMAILJS_PUBLIC_KEY }}
          EMAILJS_PRIVATE_KEY: ${{ secrets.EMAILJS_PRIVATE_KEY }}
        run: node scripts/send-daily-reminders.cjs
