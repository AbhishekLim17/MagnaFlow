# Creates the next occurrence of repeating tasks once the current one is finished.
#
# The browser cannot do this itself: the person completing a task is usually its assignee,
# who may only change its status, and the next occurrence must keep the original author.
# Hourly is a ceiling on how long a completed repeating task waits for its successor.
#
# NOTE: GitHub disables scheduled workflows after 60 days without repository activity.
# If repeating tasks stop coming back, check that first.

name: Repeating tasks

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'List what would be created without creating it'
        type: boolean
        default: false

# The job is idempotent (one transaction per occurrence), but there is no point running two.
concurrency:
  group: recurring-tasks
  cancel-in-progress: false

jobs:
  roll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install firebase-admin --no-save

      - name: Create next occurrences
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MAGNAFLOW_07SEP25 }}
        run: node scripts/roll-recurring-tasks.cjs ${{ inputs.dry_run && '--dry-run' || '' }}
