# Staging deploys.
#
# Production ships straight from main, so there was nowhere to try a change
# against real Firebase before users saw it. This publishes the same build to a
# long-lived Hosting preview channel at a separate URL.
#
# Trigger it manually from the Actions tab ("Run workflow"), optionally naming
# a branch to deploy. Runs the same test gates as production — a staging build
# that skipped them would not tell you much.
#
# NOTE: the staging channel points at the SAME Firestore project as production.
# It is a safe place to check UI and deploy mechanics, not a sandbox for
# destructive data experiments.

name: Deploy to staging

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch or SHA to deploy (defaults to the current branch)'
        required: false
        type: string

jobs:
  build_and_deploy_staging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Unit and component tests
        run: npm test
      # firebase-tools v15 requires JDK 21+ for the Firestore emulator.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Firestore security rules tests
        run: npm run test:rules
      - run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ vars.VITE_FIREBASE_MEASUREMENT_ID }}
          VITE_EMAILJS_SERVICE_ID: ${{ vars.VITE_EMAILJS_SERVICE_ID }}
          VITE_EMAILJS_TEMPLATE_ID: ${{ vars.VITE_EMAILJS_TEMPLATE_ID }}
          VITE_EMAILJS_PUBLIC_KEY: ${{ vars.VITE_EMAILJS_PUBLIC_KEY }}
          VITE_CC_EMAILS: ${{ vars.VITE_CC_EMAILS }}
          VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MAGNAFLOW_07SEP25 }}
          projectId: magnaflow-07sep25
          channelId: staging
          expires: 30d
